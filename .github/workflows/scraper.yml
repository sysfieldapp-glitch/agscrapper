name: Run Daily Alfagift Scraper

on:
  schedule:
    # Jalan otomatis setiap hari jam 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch: # Supaya bisa dijalankan manual lewat tombol di GitHub Actions

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Scraper Script
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          GAS_URL: ${{ secrets.GAS_URL }}
        run: |
          python scraper_gabungan.py

      - name: Commit and Push Scraped Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git status
          git diff-index --quiet HEAD || (git commit -m "Auto update scraped data [$(date +'%Y-%m-%d')]" && git push)
